services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mavera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mavera}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mavera-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mavera} -d ${POSTGRES_DB:-mavera}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mavera-postgres:
